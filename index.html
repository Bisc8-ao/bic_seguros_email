<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail Marketing BIC Seguros</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
            margin-bottom: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
        }

        ol {
            list-style: none;
            counter-reset: item;
            background: #fff;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            min-width: 320px;
        }

        ol li {
            counter-increment: item;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: background 0.2s ease;
        }

        ol li:hover {
            background: #f3f4f6;
        }

        ol li + li {
            border-top: 1px solid #e5e7eb;
        }

        ol li::before {
            content: counter(item);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 50%;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }

        ol li a {
            text-decoration: none;
            color: #374151;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.2s ease;
        }

        ol li a:hover {
            color: #667eea;
        }
    </style>
</head>

        <li><a href="./pages/04-lista-texto-separado.html">Lista Texto Separado</a></li>
    </ol>
</body>
</html>
